name: Buscar vagas

on:
  # Disparo principal: cron-job.org chama a API do GitHub a cada 15 min (pontual).
  workflow_dispatch:
  # Reserva: se o cron-job.org falhar, o próprio GitHub roda 1x por hora (pode atrasar).
  schedule:
    - cron: '17 * * * *'

# Nunca roda duas buscas ao mesmo tempo (evita mensagem duplicada).
concurrency:
  group: buscar-vagas
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Buscar, avaliar e notificar
        run: node src/scan.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          # Opcional: último recurso pago, com teto mensal definido em config/config.json → openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Opcionais (Settings → Secrets and variables → Actions → Variables):
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          LOG_JOBS: ${{ vars.LOG_JOBS }}
